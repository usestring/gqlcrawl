name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: Verify release ref handling
        run: ./scripts/verify-release-ref_test.sh
      - name: Verify release packaging
        run: |
          release_directory="$RUNNER_TEMP/gqlcrawl-release"
          ./scripts/build-release.sh v0.0.0 "$release_directory"
          test "$("$release_directory/gqlcrawl_0.0.0_linux_amd64" version)" = "v0.0.0"
          cd "$release_directory"
          sha256sum --check checksums.txt
