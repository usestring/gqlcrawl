name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to recover
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'usestring/gqlcrawl'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release ref
        id: release
        run: |
          release_commit="$(./scripts/verify-release-ref.sh "$RELEASE_TAG")"
          printf 'commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
      - name: Check out verified release source
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$RELEASE_COMMIT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build release artifacts
        run: ./scripts/build-release.sh "$RELEASE_TAG" dist
      - name: Verify release artifacts
        run: |
          cd dist
          sha256sum --check checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "gqlcrawl $RELEASE_TAG"
