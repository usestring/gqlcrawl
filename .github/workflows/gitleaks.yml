name: Gitleaks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # A new push to a pull request supersedes the run already in flight, and
  # nothing downstream waits on the older one. Push events are exempt: a push
  # run is the record that a given commit passed, so it always finishes.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: git --redact --verbose --exit-code=1 /github/workspace
